<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">PYLA architecture</title>
<desc id="d">The PYLA desktop app runs as the user with a local SQLite database, reads the Ubuntu Security API and the public profiles over HTTPS, and performs privileged actions only through pyla-helper, started via pkexec and authorised by polkit.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#59636e"/></marker></defs>
<rect width="1000" height="600" fill="#ffffff"/>
<rect x="24" y="24" width="452" height="552" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.4"/>
<text x="42" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#59636e" text-anchor="start">USER SESSION</text>
<text x="42" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">runs as the logged-in user, no privileges</text>
<rect x="524" y="24" width="452" height="170" rx="14" fill="#f2f7ff" stroke="#3b82c4" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="542" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#1f5f99" text-anchor="start">INTERNET</text>
<text x="542" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">HTTPS, read-only</text>
<rect x="524" y="226" width="452" height="350" rx="14" fill="#fff5f4" stroke="#d1242f" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="542" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#b3141f" text-anchor="start">ROOT</text>
<text x="542" y="272" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">only through polkit (auth_admin_keep)</text>
<rect x="52" y="96" width="396" height="190" rx="10" fill="#fff6e8" stroke="#d98a1c" stroke-width="1.2"/>
<text x="68" y="124" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#b8690b" text-anchor="start">PYLA desktop app</text>
<text x="68" y="146" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Tauri 2 shell, Rust backend</text>
<text x="68" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">UI: HTML, CSS, JavaScript (no framework, strict CSP)</text>
<text x="68" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">pyla-core: rule model, validation, apply planner,</text>
<text x="68" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">UFW and nftables parsers, JSONC import,</text>
<text x="68" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">CVE classifier, mitigation registry</text>
<text x="68" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">Italian and English interface</text>
<rect x="52" y="376" width="396" height="170" rx="10" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.2"/>
<text x="68" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Local database (SQLite)</text>
<text x="68" y="426" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">rule sets and per-rule state</text>
<text x="68" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">apply history with before/after snapshots</text>
<text x="68" y="464" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">settings, followed CVEs, CVE cache (6 h)</text>
<text x="68" y="483" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">~/.local/share/space.pyla.app/pyla.db</text>
<path d="M250,286 L250,370" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="262" y="332" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#59636e" text-anchor="start">read / write</text>
<rect x="546" y="82" width="200" height="92" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.2"/>
<text x="562" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Ubuntu Security API</text>
<text x="562" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">ubuntu.com/security</text>
<text x="562" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">kernel CVEs, fixed versions</text>
<rect x="756" y="82" width="200" height="92" rx="10" fill="#ffffff" stroke="#3b82c4" stroke-width="1.2"/>
<text x="772" y="110" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#1f2328" text-anchor="start">Public profiles</text>
<text x="772" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">github.com/pyla-dev/</text>
<text x="772" y="151" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">pyla-profiles (fixed source)</text>
<path d="M448,140 L538,140" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="493" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#59636e" text-anchor="middle">HTTPS</text>
<rect x="546" y="290" width="410" height="112" rx="10" fill="#ffffff" stroke="#d1242f" stroke-width="1.2"/>
<text x="562" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#b3141f" text-anchor="start">pyla-helper</text>
<text x="562" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">/usr/local/libexec/pyla/pyla-helper</text>
<text x="562" y="359" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">JSON in / JSON out, size-limited requests</text>
<text x="562" y="378" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#59636e" text-anchor="start">allow-listed commands, absolute paths, no shell</text>
