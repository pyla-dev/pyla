[workspace]
resolver = "2"
members = ["crates/pyla-core", "crates/pyla-helper", "src-tauri"]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["PYLA Project <maintainers@pyla.space>"]
license = "MIT"

[workspace.dependencies]
pyla-core = { path = "crates/pyla-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
strip = true
